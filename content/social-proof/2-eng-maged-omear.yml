quote: >-
  I have known Abdulrahman Al-Khateeb for over 10 years through robotics and AI programs, where he consistently stood out as an exceptional student and leader. As team leader of Yemen’s national team, he helped achieve third place globally at the FIRST Global Challenge in 2021. Abdulrahman is highly skilled, responsible, hardworking, and passionate about growth.
